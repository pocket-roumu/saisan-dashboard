<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採算管理 | 新宿パートナーズ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
  background: #f5f5f5;
  color: #333;
  font-size: 13px;
}

.header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 0 16px;
  display: flex;
  align-items: center;
  height: 40px;
  gap: 16px;
}

.header-tabs {
  display: flex;
  gap: 0;
}

.tab {
  padding: 0 16px;
  height: 40px;
  display: flex;
  align-items: center;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  color: #666;
  font-size: 13px;
  gap: 6px;
}

.tab.active {
  border-bottom-color: #1a73e8;
  color: #1a73e8;
}

.tab:hover { background: #f8f8f8; }

.header-right {
  margin-left: auto;
  font-size: 12px;
  color: #666;
}

.layout {
  display: flex;
  height: calc(100vh - 40px);
}

.sidebar {
  width: 200px;
  min-width: 200px;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 16px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.sidebar-section label {
  display: block;
  font-size: 11px;
  color: #666;
  margin-bottom: 4px;
  font-weight: 600;
}

.radio-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.radio-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #333;
  font-weight: normal;
  cursor: pointer;
}

.date-range {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}

.date-range input {
  border: 1px solid #ddd;
  border-radius: 3px;
  padding: 3px 6px;
  font-size: 11px;
  width: 80px;
}

select {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 3px;
  padding: 4px 6px;
  font-size: 12px;
  background: #fff;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #333;
  cursor: pointer;
  margin-top: 2px;
}

input[type="text"] {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 3px;
  padding: 4px 6px;
  font-size: 12px;
}

.btn-calc {
  background: #1a73e8;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 8px;
  width: 100%;
  font-size: 13px;
  cursor: pointer;
  margin-top: 4px;
}

.btn-calc:hover { background: #1557b0; }
.btn-calc:disabled { background: #aaa; cursor: not-allowed; }

.main {
  flex: 1;
  overflow: auto;
  padding: 16px;
}

.period-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 12px;
  color: #333;
}

.table-container {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 4px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  background: #f8f8f8;
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid #ddd;
  border-right: 1px solid #eee;
  font-weight: 600;
  color: #555;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

th:hover { background: #f0f0f0; }
th.num { text-align: right; }

td {
  padding: 7px 10px;
  border-bottom: 1px solid #f0f0f0;
  border-right: 1px solid #f5f5f5;
  white-space: nowrap;
}

td.num { text-align: right; }
td.name { color: #1a73e8; cursor: pointer; }
td.name:hover { text-decoration: underline; }

tr:hover td { background: #f8f9ff; }

tr.total-row td {
  background: #f8f8f8;
  font-weight: bold;
  border-top: 2px solid #ddd;
}

.loss { color: #d93025; font-weight: bold; }
.profit { color: #333; }

.bar-cell {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-end;
}

.bar-wrap {
  width: 50px;
  height: 8px;
  background: #eee;
  border-radius: 2px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 2px;
}

.bar-fill.positive { background: #1a73e8; }
.bar-fill.negative { background: #d93025; }

.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  padding: 8px 10px;
  background: #f8f8f8;
  border-top: 1px solid #ddd;
  font-size: 12px;
}

.page-btn {
  border: 1px solid #ddd;
  background: #fff;
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
}

.page-btn:disabled { color: #aaa; cursor: not-allowed; }
.page-btn:hover:not(:disabled) { background: #f0f0f0; }

.loading {
  text-align: center;
  padding: 48px;
  color: #666;
}

.error-msg {
  background: #fce8e6;
  border: 1px solid #f28b82;
  color: #c5221f;
  padding: 10px 14px;
  border-radius: 4px;
  margin-bottom: 12px;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-tabs">
    <div class="tab active" onclick="switchTab('soneki')" id="tab-soneki">📊 損益分析</div>
    <div class="tab" onclick="switchTab('seisansei')" id="tab-seisansei">📈 生産性分析</div>
  </div>
  <div class="header-right">報酬：報酬管理</div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-section">
      <label>期間</label>
      <div class="radio-group">
        <label><input type="radio" name="period" value="prev" onchange="onPeriodChange()"> 前月</label>
        <label><input type="radio" name="period" value="year" checked onchange="onPeriodChange()"> 直近1年</label>
        <label><input type="radio" name="period" value="custom" onchange="onPeriodChange()"> 期間指定</label>
      </div>
      <div class="date-range" id="custom-range" style="display:none;margin-top:6px">
        <input type="month" id="date-from">〜
        <input type="month" id="date-to">
      </div>
    </div>

    <div class="sidebar-section">
      <label>担当者</label>
      <select id="filter-staff1"><option value="">すべて表示</option></select>
      <select id="filter-staff2" style="margin-top:4px"><option value="">すべて表示</option></select>
      <label class="checkbox-label" style="margin-top:4px">
        <input type="checkbox" id="main-only"> 主担当先のみ
      </label>
    </div>

    <div class="sidebar-section">
      <label>決算月</label>
      <select id="filter-month">
        <option value="">すべて</option>
        <option value="1">1月</option><option value="2">2月</option>
        <option value="3">3月</option><option value="4">4月</option>
        <option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option>
        <option value="9">9月</option><option value="10">10月</option>
        <option value="11">11月</option><option value="12">12月</option>
      </select>
    </div>

    <div class="sidebar-section">
      <label>キーワード</label>
      <input type="text" id="filter-keyword" placeholder="キーワード検索">
    </div>

    <div class="sidebar-section">
      <label>オプション</label>
      <label class="checkbox-label">
        <input type="checkbox" id="only-with-data"> 報酬または工数がある行のみ表示
      </label>
    </div>

    <button class="btn-calc" onclick="loadData()" id="calc-btn">集計</button>
  </div>

  <div class="main">
    <div id="error-area"></div>
    <div class="period-title" id="period-title"></div>
    <div id="content"><div class="loading">集計ボタンを押してください</div></div>
  </div>
</div>

<script>
const PROXY = 'https://notion-proxy.s-partners.workers.dev';
const HOSHU_DB = 'b22821a235f34ed8b6364d3f5b80b8cc';
const NIPPO_DB = '93169cd0-31ce-4078-b427-66747ef76cb7';
const KOKYAKU_DB = '46aa67c514ab47e79c7eec4af7fe0786';

let currentTab = 'soneki';
let allData = [];
let currentPage = 1;
const PAGE_SIZE = 20;

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-soneki').className = 'tab' + (tab === 'soneki' ? ' active' : '');
  document.getElementById('tab-seisansei').className = 'tab' + (tab === 'seisansei' ? ' active' : '');
  if (allData.length > 0) renderTable();
}

function onPeriodChange() {
  const val = document.querySelector('input[name="period"]:checked').value;
  document.getElementById('custom-range').style.display = val === 'custom' ? 'flex' : 'none';
}

function getDateRange() {
  const val = document.querySelector('input[name="period"]:checked').value;
  const now = new Date();
  let from, to;

  if (val === 'prev') {
    const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    from = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    const last = new Date(now.getFullYear(), now.getMonth(), 0);
    to = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${last.getDate()}`;
  } else if (val === 'year') {
    const d = new Date(now.getFullYear(), now.getMonth() - 11, 1);
    from = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    to = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${last.getDate()}`;
  } else {
    const f = document.getElementById('date-from').value;
    const t = document.getElementById('date-to').value;
    if (!f || !t) { alert('期間を入力してください'); return null; }
    from = f + '-01';
    const [ty, tm] = t.split('-');
    const last = new Date(parseInt(ty), parseInt(tm), 0);
    to = `${ty}-${tm}-${last.getDate()}`;
  }
  return { from, to };
}

function fmt(n) {
  if (n == null || n === 0) return '';
  return Math.round(n).toLocaleString();
}

async function notionQuery(dbId, body) {
  const rows = [];
  let cursor = null;
  do {
    const payload = { ...body, page_size: 100 };
    if (cursor) payload.start_cursor = cursor;
    const res = await fetch(`${PROXY}/notion/databases/${dbId}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.results) throw new Error(data.message || 'API Error');
    rows.push(...data.results);
    cursor = data.has_more ? data.next_cursor : null;
  } while (cursor);
  return rows;
}

async function loadData() {
  const range = getDateRange();
  if (!range) return;

  const btn = document.getElementById('calc-btn');
  btn.disabled = true;
  btn.textContent = '集計中...';
  document.getElementById('error-area').innerHTML = '';
  document.getElementById('content').innerHTML = '<div class="loading">データ取得中...</div>';

  try {
    // 期間タイトル
    const fromLabel = range.from.slice(0, 7).replace('-', '年') + '月';
    const toLabel = range.to.slice(0, 7).replace('-', '年') + '月';
    document.getElementById('period-title').textContent = `${fromLabel}〜${toLabel}`;

    // 日報データ取得（期間内）
    const nippoRows = await notionQuery(NIPPO_DB, {
      filter: {
        and: [
          { property: '日付', date: { on_or_after: range.from } },
          { property: '日付', date: { on_or_before: range.to } }
        ]
      }
    });

    // 顧客別工数集計
    const koshuMap = {};
    nippoRows.forEach(page => {
      const rel = page.properties['顧客名']?.relation;
      const jikan = page.properties['時間']?.number ?? 0;
      if (rel && rel.length > 0) {
        const id = rel[0].id;
        koshuMap[id] = (koshuMap[id] || 0) + jikan;
      }
    });

    // 報酬DBデータ取得
    const hoshuRows = await notionQuery(HOSHU_DB, {});

    // データ合成
    allData = hoshuRows.map(page => {
      const p = page.properties;
      const name = p['顧客名']?.title?.[0]?.plain_text ?? '';
      const code = p['顧客リレーション']?.relation?.[0]?.id ?? '';
      const 月額 = p['月額報酬']?.number ?? 0;
      const 決算 = p['決算時報酬']?.number ?? 0;
      const 確定 = p['R7確定申告報酬']?.number ?? 0;
      const その他 = p['その他報酬']?.number ?? 0;
      const 報酬合計 = 月額 * 12 + 決算 + 確定 + その他;
      const 申告月 = p['申告月']?.rollup?.array?.[0]?.formula?.number ?? null;
      const 工数 = koshuMap[page.id] ?? 0;
      const 時間単価 = 工数 > 0 ? Math.round(報酬合計 / 工数) : 0;
      const 人件費 = 工数 * 10000;
      const 損益 = 報酬合計 - 人件費;
      const 利益率 = 報酬合計 > 0 ? Math.round(損益 / 報酬合計 * 100 * 10) / 10 : 0;

      return { name, code, 報酬合計, 申告月, 工数, 時間単価, 人件費, 損益, 利益率 };
    }).filter(d => d.name);

    currentPage = 1;
    renderTable();

  } catch(e) {
    document.getElementById('error-area').innerHTML = `<div class="error-msg">エラー: ${e.message}</div>`;
    document.getElementById('content').innerHTML = '';
  } finally {
    btn.disabled = false;
    btn.textContent = '集計';
  }
}

function getFiltered() {
  const keyword = document.getElementById('filter-keyword').value.toLowerCase();
  const month = document.getElementById('filter-month').value;
  const onlyData = document.getElementById('only-with-data').checked;

  return allData.filter(d => {
    if (keyword && !d.name.toLowerCase().includes(keyword)) return false;
    if (month && d.申告月 != month) return false;
    if (onlyData && d.報酬合計 === 0 && d.工数 === 0) return false;
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  // 合計
  const sumHoshu = filtered.reduce((s, d) => s + d.報酬合計, 0);
  const sumKoshu = filtered.reduce((s, d) => s + d.工数, 0);
  const sumJinken = filtered.reduce((s, d) => s + d.人件費, 0);
  const sumSoneki = filtered.reduce((s, d) => s + d.損益, 0);
  const avgRieki = sumHoshu > 0 ? Math.round(sumSoneki / sumHoshu * 100 * 10) / 10 : 0;
  const avgJikan = sumKoshu > 0 ? Math.round(sumHoshu / sumKoshu) : 0;

  const maxVal = Math.max(...filtered.map(d => Math.abs(currentTab === 'soneki' ? d.損益 : d.時間単価)));

  let html = '';

  if (currentTab === 'soneki') {
    html = `
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:70px">コード</th>
            <th>顧客名</th>
            <th class="num">報酬</th>
            <th class="num">人件費</th>
            <th class="num">損益</th>
            <th class="num">利益率</th>
            <th class="num" style="width:120px">損益グラフ</th>
          </tr>
        </thead>
        <tbody>
          ${page.map(d => {
            const pct = maxVal > 0 ? Math.abs(d.損益) / maxVal * 50 : 0;
            const isLoss = d.損益 < 0;
            return `<tr>
              <td>${d.code || ''}</td>
              <td class="name">${d.name}</td>
              <td class="num">${fmt(d.報酬合計)}</td>
              <td class="num">${fmt(d.人件費)}</td>
              <td class="num ${isLoss ? 'loss' : ''}">${fmt(d.損益)}</td>
              <td class="num">${d.利益率 ? d.利益率 + '%' : ''}</td>
              <td>
                <div class="bar-cell">
                  <div class="bar-wrap">
                    <div class="bar-fill ${isLoss ? 'negative' : 'positive'}" style="width:${pct}px"></div>
                  </div>
                </div>
              </td>
            </tr>`;
          }).join('')}
          <tr class="total-row">
            <td colspan="2">総計</td>
            <td class="num">${fmt(sumHoshu)}</td>
            <td class="num">${fmt(sumJinken)}</td>
            <td class="num ${sumSoneki < 0 ? 'loss' : ''}">${fmt(sumSoneki)}</td>
            <td class="num">${avgRieki}%</td>
            <td></td>
          </tr>
        </tbody>
      </table>
      ${renderPagination(currentPage, totalPages, total)}
    </div>`;
  } else {
    html = `
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:70px">コード</th>
            <th>顧客名</th>
            <th class="num">報酬</th>
            <th class="num">工数</th>
            <th class="num" style="width:160px">時間あたり報酬</th>
          </tr>
        </thead>
        <tbody>
          ${page.map(d => {
            const pct = maxVal > 0 ? d.時間単価 / maxVal * 50 : 0;
            return `<tr>
              <td>${d.code || ''}</td>
              <td class="name">${d.name}</td>
              <td class="num">${fmt(d.報酬合計)}</td>
              <td class="num">${d.工数 ? d.工数.toFixed(2) : ''}</td>
              <td>
                <div class="bar-cell">
                  <div class="bar-wrap">
                    <div class="bar-fill positive" style="width:${pct}px"></div>
                  </div>
                  <span>${fmt(d.時間単価)}</span>
                </div>
              </td>
            </tr>`;
          }).join('')}
          <tr class="total-row">
            <td colspan="2">総計</td>
            <td class="num">${fmt(sumHoshu)}</td>
            <td class="num">${sumKoshu.toFixed(2)}</td>
            <td class="num">${fmt(avgJikan)}</td>
          </tr>
        </tbody>
      </table>
      ${renderPagination(currentPage, totalPages, total)}
    </div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function renderPagination(current, total, count) {
  return `
    <div class="pagination">
      <span>${count}件</span>
      <button class="page-btn" onclick="goPage(1)" ${current===1?'disabled':''}>«</button>
      <button class="page-btn" onclick="goPage(${current-1})" ${current===1?'disabled':''}>‹</button>
      <span>${current} / ${total}</span>
      <button class="page-btn" onclick="goPage(${current+1})" ${current===total?'disabled':''}>›</button>
      <button class="page-btn" onclick="goPage(${total})" ${current===total?'disabled':''}>»</button>
    </div>`;
}

function goPage(p) {
  currentPage = p;
  renderTable();
  document.querySelector('.main').scrollTop = 0;
}

// 初期化
onPeriodChange();
</script>
</body>
</html>
