<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工数管理 | 新宿パートナーズ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --border: #e4e4e0;
  --border-light: #f0f0ec;
  --text: #1a1a1a;
  --text-muted: #6b6b6b;
  --text-dim: #a0a09a;
  --accent: #1a1a1a;
  --red: #c0392b;
  --blue: #2563eb;
  --green: #16a34a;
}

body {
  font-family: 'Inter', 'Hiragino Kaku Gothic Pro', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: center;
  height: 52px;
  gap: 0;
}

.header-logo {
  display: flex;
  align-items: center;
  margin-right: 28px;
}

.header-logo img {
  height: 28px;
  width: auto;
}

.tab {
  padding: 0 16px;
  height: 52px;
  display: flex;
  align-items: center;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  transition: color 0.15s;
}

.tab.active { border-bottom-color: var(--accent); color: var(--accent); }
.tab:hover { color: var(--text); }

.layout { display: flex; height: calc(100vh - 52px); }

.sidebar {
  width: 192px;
  min-width: 192px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sidebar-label {
  display: block;
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.radio-group { display: flex; flex-direction: column; gap: 5px; }

.radio-group label,
.checkbox-group label,
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 400;
}

.radio-group label:hover,
.checkbox-group label:hover,
.checkbox-label:hover { color: var(--text); }

input[type="radio"], input[type="checkbox"] {
  accent-color: var(--accent);
  width: 12px;
  height: 12px;
}

.date-range { display: flex; align-items: center; gap: 4px; margin-top: 6px; }

.date-range input,
input[type="month"],
input[type="text"],
select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-family: inherit;
  outline: none;
}

.date-range input { width: 76px; }
input[type="text"], select { width: 100%; }

.checkbox-group { display: flex; flex-direction: column; gap: 4px; }

.btn-calc {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 9px;
  width: 100%;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  margin-top: 4px;
  transition: opacity 0.15s;
}

.btn-calc:hover { opacity: 0.85; }
.btn-calc:disabled { opacity: 0.4; cursor: not-allowed; }

.main { flex: 1; overflow: auto; padding: 20px 24px; }

.period-title {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 14px;
}

/* サマリーカード */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px 18px;
}

.summary-card-label {
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.summary-card-value {
  font-size: 22px;
  font-weight: 300;
  color: var(--text);
  letter-spacing: -0.5px;
  line-height: 1;
}

.summary-card-unit {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

/* テーブル */
.table-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

table { width: 100%; border-collapse: collapse; font-size: 12px; }

th {
  background: var(--bg);
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  cursor: pointer;
  font-size: 11px;
}

th.num { text-align: right; }
th:hover { color: var(--text); }

td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
  color: var(--text);
}

td.num { text-align: right; color: var(--text-muted); }
td.name { color: var(--blue); cursor: pointer; }
td.name:hover { text-decoration: underline; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }

tr.total-row td {
  background: var(--bg);
  font-weight: 600;
  border-top: 1px solid var(--border);
  color: var(--text);
}

.loss { color: var(--red) !important; font-weight: 500; }
.low-tanka { color: var(--red) !important; }

.bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.bar-wrap { width: 48px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; }
.bar-fill.positive { background: var(--blue); }
.bar-fill.negative { background: var(--red); }

.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  padding: 10px 12px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}

.page-btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  padding: 3px 9px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
}

.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-btn:hover:not(:disabled) { background: var(--bg); color: var(--text); }

.loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 13px; }

.error-msg {
  background: #fff5f5;
  border: 1px solid #fecaca;
  color: var(--red);
  padding: 10px 14px;
  border-radius: 4px;
  margin-bottom: 12px;
  font-size: 12px;
}

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  width: 680px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}

.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.modal-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }

.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: none; border: none;
  font-size: 16px; cursor: pointer;
  color: var(--text-muted);
}

.modal-close:hover { color: var(--text); }
.modal-section { margin-bottom: 20px; }

.modal-section-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.detail-table th { background: var(--bg); padding: 7px 10px; text-align: right; font-weight: 500; color: var(--text-muted); border-bottom: 1px solid var(--border); cursor: default; }
.detail-table th:first-child { text-align: left; }
.detail-table td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border-light); color: var(--text-muted); }
.detail-table td:first-child { text-align: left; color: var(--text); }
.detail-table tr:last-child td { font-weight: 600; background: var(--bg); border-top: 1px solid var(--border); color: var(--text); }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <img src="https://pocket-roumu.github.io/saisan-dashboard/logo.png" alt="SHINJUKU PARTNERS" style="height:30px;width:auto">
  </div>
  <div style="display:flex;gap:0">
    <div class="tab active" onclick="switchTab('soneki')" id="tab-soneki">📊 損益分析</div>
    <div class="tab" onclick="switchTab('seisansei')" id="tab-seisansei">📈 生産性分析</div>
    <div class="tab" onclick="switchTab('member')" id="tab-member">👤 メンバー別</div>
  </div>

</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-section">
      <span class="sidebar-label">期間</span>
      <div class="radio-group">
        <label><input type="radio" name="period" value="prev" onchange="onPeriodChange()"> 前月</label>
        <label><input type="radio" name="period" value="year" checked onchange="onPeriodChange()"> 直近1年</label>

    <div class="sidebar-section">

      <div class="checkbox-group" id="gyomu-checks">

        <label><input type="checkbox" value="法人決算" onchange="onGyomuChange()"> 法人決算</label>
        <label><input type="checkbox" value="年末調整" onchange="onGyomuChange()"> 年末調整</label>
        <label><input type="checkbox" value="月次" onchange="onGyomuChange()"> 月次</label>
        <label><input type="checkbox" value="源泉納付" onchange="onGyomuChange()"> 源泉納付</label>
        <label><input type="checkbox" value="申告書作成" onchange="onGyomuChange()"> 申告書作成</label>
        <label><input type="checkbox" value="給与計算" onchange="onGyomuChange()"> 給与計算</label>
        <label><input type="checkbox" value="償却資産" onchange="onGyomuChange()"> 償却資産</label>
        <label><input type="checkbox" value="法定調書" onchange="onGyomuChange()"> 法定調書</label>
        <label><input type="checkbox" value="確定申告" onchange="onGyomuChange()"> 確定申告</label>
        <label><input type="checkbox" value="ミーティング" onchange="onGyomuChange()"> ミーティング</label>
        <label><input type="checkbox" value="社内作業" onchange="onGyomuChange()"> 社内作業</label>
        <label><input type="checkbox" value="その他" onchange="onGyomuChange()"> その他</label>

    <div class="sidebar-section">
      <span class="sidebar-label">決算月</span>
      <select id="filter-month">
        <option value="">すべて</option>
        <option value="1">1月</option><option value="2">2月</option>
        <option value="3">3月</option><option value="4">4月</option>
        <option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option>
        <option value="9">9月</option><option value="10">10月</option>
        <option value="11">11月</option><option value="12">12月</option>
      </select>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">キーワード</span>
      <input type="text" id="filter-keyword" placeholder="キーワード検索">
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">オプション</span>
      <label class="checkbox-label">
        <input type="checkbox" id="only-with-data" checked> 報酬または工数がある行のみ
      </label>
    </div>

    <button class="btn-calc" onclick="loadData()" id="calc-btn">集計</button>
  </div>

  <div class="main">
    <div id="error-area"></div>
    <div class="period-title" id="period-title"></div>
    <div id="summary-cards" style="display:none">
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-card-label">工数合計</div>
          <div class="summary-card-value" id="sum-koshu">—</div>

<!-- 詳細モーダル -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('show')">✕</button>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-subtitle" id="modal-subtitle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const PROXY = 'https://notion-proxy.s-partners.workers.dev';
const HOSHU_DB = 'b22821a235f34ed8b6364d3f5b80b8cc';
const NIPPO_DB = '93169cd0-31ce-4078-b427-66747ef76cb7';

let currentTab = 'soneki';
let allData = [];
let nippoRaw = [];
let currentPage = 1;
const PAGE_SIZE = 50;
let sortKey = '時間単価';
let sortDir = -1; // -1=降順, 1=昇順
const JIKEN_TANKA = 10000;

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-soneki').className = 'tab' + (tab === 'soneki' ? ' active' : '');
  document.getElementById('tab-seisansei').className = 'tab' + (tab === 'seisansei' ? ' active' : '');
  document.getElementById('tab-member').className = 'tab' + (tab === 'member' ? ' active' : '');
  if (allData.length > 0) renderTable();
}

function onPeriodChange() {
  const val = document.querySelector('input[name="period"]:checked').value;
  document.getElementById('custom-range').style.display = val === 'custom' ? 'flex' : 'none';
}

function onGyomuAll(cb) {
  const checks = document.querySelectorAll('#gyomu-checks input[type=checkbox]:not([value=すべて])');
  checks.forEach(c => c.checked = false);
}

function onGyomuChange() {
  document.querySelector('#gyomu-checks input[value=すべて]').checked = false;
}

function getSelectedGyomu() {
  const all = document.querySelector('#gyomu-checks input[value=すべて]').checked;
  if (all) return null;
  const checks = document.querySelectorAll('#gyomu-checks input[type=checkbox]:not([value=すべて]):checked');
  return Array.from(checks).map(c => c.value);
}

function getDateRange() {
  const val = document.querySelector('input[name="period"]:checked').value;
  const now = new Date();
  let from, to;
  if (val === 'prev') {
    const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    from = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    const last = new Date(now.getFullYear(), now.getMonth(), 0);
    to = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${last.getDate()}`;
  } else if (val === 'year') {
    const d = new Date(now.getFullYear(), now.getMonth() - 11, 1);
    from = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    to = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${last.getDate()}`;
  } else {
    const f = document.getElementById('date-from').value;
    const t = document.getElementById('date-to').value;
    if (!f || !t) { alert('期間を入力してください'); return null; }
    from = f + '-01';
    const [ty, tm] = t.split('-');
    const last = new Date(parseInt(ty), parseInt(tm), 0);
    to = `${ty}-${tm}-${last.getDate()}`;
  }
  return { from, to };
}

function fmt(n) {
  if (!n) return '';
  return Math.round(n).toLocaleString();
}

async function notionQuery(dbId, body) {
  const rows = [];
  let cursor = null;
  do {
    const payload = { ...body, page_size: 100 };
    if (cursor) payload.start_cursor = cursor;
    const res = await fetch(`${PROXY}/notion/databases/${dbId}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.results) throw new Error(data.message || 'API Error');
    rows.push(...data.results);
    cursor = data.has_more ? data.next_cursor : null;
  } while (cursor);
  return rows;
}

async function loadData() {
  const range = getDateRange();
  if (!range) return;

  const btn = document.getElementById('calc-btn');
  btn.disabled = true;
  btn.textContent = '集計中...';
  document.getElementById('error-area').innerHTML = '';
  document.getElementById('content').innerHTML = '<div class="loading">データ取得中...</div>';

  try {
    const fromLabel = range.from.slice(0,7).replace('-','年') + '月';
    const toLabel = range.to.slice(0,7).replace('-','年') + '月';
    document.getElementById('period-title').textContent = `${fromLabel}〜${toLabel}`;
    window.currentRange = range;

    // 日報取得
    nippoRaw = await notionQuery(NIPPO_DB, {
      filter: {
        and: [
          { property: '日付', date: { on_or_after: range.from } },
          { property: '日付', date: { on_or_before: range.to } }
        ]
      }
    });

    // 顧客別・業務別工数集計
    const koshuMap = {}; // { hoshuPageId: { total: n, byGyomu: { 法人決算: n, ... } } }
    nippoRaw.forEach(page => {
      const rel = page.properties['顧客名']?.relation;
      const jikan = page.properties['時間']?.number ?? 0;
      const gyomu = page.properties['作業種別']?.select?.name ?? 'その他';
      const tantouArr = page.properties['担当者']?.people ?? [];
      const tantou = tantouArr.map(p => p.name).join('・') || '未設定';
      if (rel && rel.length > 0) {
        const id = rel[0].id;
        if (!koshuMap[id]) koshuMap[id] = { total: 0, byGyomu: {}, byTantou: {} };
        koshuMap[id].total += jikan;
        koshuMap[id].byGyomu[gyomu] = (koshuMap[id].byGyomu[gyomu] || 0) + jikan;
        koshuMap[id].byTantou[tantou] = (koshuMap[id].byTantou[tantou] || 0) + jikan;
      }
    });

    // 報酬DB取得
    const hoshuRows = await notionQuery(HOSHU_DB, {});

    allData = hoshuRows.map(page => {
      const p = page.properties;
      const rawName = p['顧客名']?.title?.[0]?.plain_text ?? '';
      const name = rawName.includes('（') ? rawName.split('（')[0].trim() : rawName;
      const 月額 = p['月額報酬']?.number ?? 0;
      const 決算 = p['決算時報酬']?.number ?? 0;
      const 確定 = p['R7確定申告報酬']?.number ?? 0;
      const その他 = p['その他報酬']?.number ?? 0;
      const 報酬合計 = 月額 * 12 + 決算 + 確定 + その他;
      const 旧月額 = p['旧月額報酬']?.number ?? 0;
      const 旧決算 = p['旧決算時報酬']?.number ?? 0;
      const 旧月額期間 = p['旧月額期間']?.rich_text?.[0]?.plain_text ?? '';
      const 前期報酬合計 = 旧月額 > 0 ? 旧月額 * 12 + 旧決算 + 確定 + その他 : 0;
      const 申告月 = p['決算月']?.rollup?.array?.[0]?.formula?.number ?? null;
      const k = koshuMap[page.id] || { total: 0, byGyomu: {}, byTantou: {} };
      const 工数 = k.total;
      const byGyomu = k.byGyomu;
      const byTantou = k.byTantou;
      const 人件費 = 工数 * JIKEN_TANKA;
      const 損益 = 報酬合計 - 人件費;
      const 利益率 = 報酬合計 > 0 ? Math.round(損益 / 報酬合計 * 100 * 10) / 10 : 0;
      const 時間単価 = 工数 > 0 ? Math.round(報酬合計 / 工数) : 0;
      return { id: page.id, name, 報酬合計, 前期報酬合計, 旧月額期間, 申告月, 工数, byGyomu, byTantou, 人件費, 損益, 利益率, 時間単価 };
    }).filter(d => d.name);

    currentPage = 1;
    renderTable();
  } catch(e) {
    document.getElementById('error-area').innerHTML = `<div class="error-msg">エラー: ${e.message}</div>`;
    document.getElementById('content').innerHTML = '';
  } finally {
    btn.disabled = false;
    btn.textContent = '集計';
  }
}

function getFiltered() {
  const keyword = document.getElementById('filter-keyword').value.toLowerCase();
  const month = document.getElementById('filter-month').value;
  const onlyData = document.getElementById('only-with-data').checked;
  const gyomu = getSelectedGyomu();

  const sorted = allData.slice().sort((a, b) => {
    const va = a[sortKey] ?? 0;
    const vb = b[sortKey] ?? 0;
    return sortDir * (vb - va);
  });
  return sorted.map(d => {
    let 工数 = d.工数;
    let byGyomu = d.byGyomu;

    // 業務分類フィルタ（工数を絞る）
    if (gyomu && gyomu.length > 0) {
      byGyomu = {};
      工数 = 0;
      gyomu.forEach(g => {
        if (d.byGyomu[g]) {
          byGyomu[g] = d.byGyomu[g];
          工数 += d.byGyomu[g];
        }
      });
    }

    const 人件費 = 工数 * JIKEN_TANKA;
    const 損益 = d.報酬合計 - 人件費;
    const 利益率 = d.報酬合計 > 0 ? Math.round(損益 / d.報酬合計 * 100 * 10) / 10 : 0;
    const 時間単価 = 工数 > 0 ? Math.round(d.報酬合計 / 工数) : 0;

    return { ...d, 工数, byGyomu, byTantou: d.byTantou, 人件費, 損益, 利益率, 時間単価 };
  }).filter(d => {
    if (keyword && !d.name.toLowerCase().includes(keyword)) return false;
    if (month && d.申告月 != month) return false;
    if (onlyData && d.報酬合計 === 0 && d.工数 === 0) return false;
    return true;
  });
}

function setSort(key) {
  if (sortKey === key) {
    sortDir *= -1;
  } else {
    sortKey = key;
    sortDir = -1;
  }
  currentPage = 1;
  renderTable();
}

function sortIcon(key) {
  if (sortKey !== key) return '<span style="color:#ccc">↕</span>';
  return sortDir === -1 ? '↓' : '↑';
}

function renderTable() {
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  const sumHoshu = filtered.reduce((s,d) => s + d.報酬合計, 0);
  const sumKoshu = filtered.reduce((s,d) => s + d.工数, 0);
  const sumJinken = filtered.reduce((s,d) => s + d.人件費, 0);
  const sumSoneki = filtered.reduce((s,d) => s + d.損益, 0);
  const avgRieki = sumHoshu > 0 ? Math.round(sumSoneki / sumHoshu * 100 * 10) / 10 : 0;
  const avgJikan = sumKoshu > 0 ? Math.round(sumHoshu / sumKoshu) : 0;

  const maxVal = Math.max(...filtered.map(d => Math.abs(currentTab === 'soneki' ? d.損益 : d.時間単価)), 1);

  let html = '';

  if (currentTab === 'soneki') {
    html = `<div class="table-container"><table>
      <thead><tr>
        <th onclick="setSort('name')" style="cursor:pointer">顧客名 ${sortIcon('name')}</th>
        <th class="num" onclick="setSort('報酬合計')" style="cursor:pointer">報酬 ${sortIcon('報酬合計')}</th>
        <th class="num" onclick="setSort('人件費')" style="cursor:pointer">人件費 ${sortIcon('人件費')}</th>
        <th class="num" onclick="setSort('損益')" style="cursor:pointer">損益 ${sortIcon('損益')}</th>
        <th class="num" onclick="setSort('利益率')" style="cursor:pointer">利益率 ${sortIcon('利益率')}</th>
        <th class="num" style="width:120px">損益グラフ</th>
      </tr></thead>
      <tbody>
        ${page.map(d => {
          const pct = Math.abs(d.損益) / maxVal * 50;
          const isLoss = d.損益 < 0;
          return `<tr>
            <td class="name" onclick="showDetail('${d.id}')">${d.name}</td>
            <td class="num">${fmt(d.報酬合計)}</td>
            <td class="num">${fmt(d.人件費)}</td>
            <td class="num ${isLoss?'loss':''}">${fmt(d.損益)}</td>
            <td class="num">${d.利益率||''}${d.利益率?'%':''}</td>
            <td><div class="bar-cell"><div class="bar-wrap"><div class="bar-fill ${isLoss?'negative':'positive'}" style="width:${pct}px"></div></div></div></td>
          </tr>`;
        }).join('')}
        <tr class="total-row">
          <td>総計</td>
          <td class="num">${fmt(sumHoshu)}</td>
          <td class="num">${fmt(sumJinken)}</td>
          <td class="num ${sumSoneki<0?'loss':''}">${fmt(sumSoneki)}</td>
          <td class="num">${avgRieki}%</td>
          <td></td>
        </tr>
      </tbody>
    </table>${renderPagination(currentPage, totalPages, total)}</div>`;
  } else {
    html = `<div class="table-container"><table>
      <thead><tr>
        <th onclick="setSort('name')" style="cursor:pointer">顧客名 ${sortIcon('name')}</th>
        <th class="num" onclick="setSort('報酬合計')" style="cursor:pointer">報酬 ${sortIcon('報酬合計')}</th>
        <th class="num" onclick="setSort('工数')" style="cursor:pointer">工数(h) ${sortIcon('工数')}</th>
        <th class="num" onclick="setSort('時間単価')" style="cursor:pointer" style="width:160px">時間あたり報酬 ${sortIcon('時間単価')}</th>
      </tr></thead>
      <tbody>
        ${page.map(d => {
          const pct = d.時間単価 / maxVal * 50;
          return `<tr>
            <td class="name" onclick="showDetail('${d.id}')">${d.name}</td>
            <td class="num">${fmt(d.報酬合計)}</td>
            <td class="num">${d.工数?d.工数.toFixed(2):''}</td>
            <td><div class="bar-cell"><div class="bar-wrap"><div class="bar-fill ${d.時間単価 < 10000 ? 'negative' : 'positive'}" style="width:${pct}px"></div></div><span class="${d.時間単価 > 0 && d.時間単価 < 10000 ? 'low-tanka' : ''}">${fmt(d.時間単価)}</span></div></td>
          </tr>`;
        }).join('')}
        <tr class="total-row">
          <td>総計</td>
          <td class="num">${fmt(sumHoshu)}</td>
          <td class="num">${sumKoshu.toFixed(2)}</td>
          <td class="num">${fmt(avgJikan)}</td>
        </tr>
      </tbody>
    </table>${renderPagination(currentPage, totalPages, total)}</div>`;
  }

  // メンバー別タブ
  if (currentTab === 'member') {
    // 顧客ごとの全工数マップを作成
    const kokyakuTotalKoshu = {}; // { hoshuPageId: 全工数 }
    const memberKokyakuKoshu = {}; // { member: { hoshuPageId: 工数 } }

    nippoRaw.forEach(page => {
      const jikan = page.properties['時間']?.number ?? 0;
      const gyomu = page.properties['作業種別']?.select?.name ?? 'その他';
      const tantouArr = page.properties['担当者']?.people ?? [];
      const tantou = tantouArr.map(p => p.name).join('・') || '未設定';
      const dateStr = page.properties['日付']?.date?.start ?? '';
      const rel = page.properties['顧客名']?.relation;
      if (!dateStr || !rel || rel.length === 0) return;
      const date = new Date(dateStr);
      if (date < new Date(currentRange.from) || date > new Date(currentRange.to)) return;
      const kokyakuId = rel[0].id;
      const jikanNum = jikan || 0;

      // 顧客ごと全工数
      kokyakuTotalKoshu[kokyakuId] = (kokyakuTotalKoshu[kokyakuId] || 0) + jikanNum;

      // メンバー×顧客の工数
      if (!memberKokyakuKoshu[tantou]) memberKokyakuKoshu[tantou] = {};
      memberKokyakuKoshu[tantou][kokyakuId] = (memberKokyakuKoshu[tantou][kokyakuId] || 0) + jikanNum;
    });

    // 顧客の報酬マップ
    const kokyakuHoshu = {};
    allData.forEach(d => { kokyakuHoshu[d.id] = d.報酬合計; });

    // メンバーごとに按分報酬を計算
    const memberStats = {};
    Object.entries(memberKokyakuKoshu).forEach(([member, kokyakuMap]) => {
      let totalKoshu = 0;
      let anbuHoshu = 0;
      let kokyakuCount = 0;
      const byGyomu = {};

      Object.entries(kokyakuMap).forEach(([kokyakuId, koshu]) => {
        totalKoshu += koshu;
        const totalK = kokyakuTotalKoshu[kokyakuId] || 1;
        const hoshu = kokyakuHoshu[kokyakuId] || 0;
        anbuHoshu += hoshu * (koshu / totalK);
        kokyakuCount++;
      });

      // 業務別工数
      nippoRaw.forEach(page => {
        const tantouArr = page.properties['担当者']?.people ?? [];
        const tantou = tantouArr.map(p => p.name).join('・') || '未設定';
        if (tantou !== member) return;
        const dateStr = page.properties['日付']?.date?.start ?? '';
        if (!dateStr) return;
        const date = new Date(dateStr);
        if (date < new Date(currentRange.from) || date > new Date(currentRange.to)) return;
        const gyomu = page.properties['作業種別']?.select?.name ?? 'その他';
        const jikan = page.properties['時間']?.number ?? 0;
        byGyomu[gyomu] = (byGyomu[gyomu] || 0) + jikan;
      });

      const jinken = totalKoshu * JIKEN_TANKA;
      const soneki = anbuHoshu - jinken;
      const rieki = anbuHoshu > 0 ? Math.round(soneki / anbuHoshu * 100 * 10) / 10 : 0;
      const jikanTanka = totalKoshu > 0 ? Math.round(anbuHoshu / totalKoshu) : 0;

      memberStats[member] = { totalKoshu, anbuHoshu, kokyakuCount, jinken, soneki, rieki, jikanTanka, byGyomu };
    });

    const members = Object.entries(memberStats).sort((a,b) => b[1].jikanTanka - a[1].jikanTanka);
    const maxTanka = Math.max(...members.map(([,v]) => v.jikanTanka), 1);

    html = `<div class="table-container"><table>
      <thead><tr>
        <th>メンバー</th>
        <th class="num">工数(h)</th>
        <th class="num">担当顧客数</th>
        <th class="num">按分報酬</th>
        <th class="num">人件費</th>
        <th class="num">按分損益</th>
        <th class="num">利益率</th>
        <th class="num" style="width:160px">時間単価</th>
      </tr></thead>
      <tbody>
        ${members.map(([name, d]) => {
          const pct = d.jikanTanka / maxTanka * 80;
          const isLoss = d.soneki < 0;
          const isLowTanka = d.jikanTanka > 0 && d.jikanTanka < 10000;
          return `<tr>
            <td style="font-weight:500;cursor:pointer;color:var(--blue)" onclick="showMemberDetail('${name}', ${JSON.stringify(d.byGyomu).replace(/'/g, "\'")})">${name}</td>
            <td class="num">${d.totalKoshu.toFixed(2)}</td>
            <td class="num">${d.kokyakuCount}</td>
            <td class="num">${fmt(d.anbuHoshu)}</td>
            <td class="num">${fmt(d.jinken)}</td>
            <td class="num ${isLoss ? 'loss' : ''}">${fmt(d.soneki)}</td>
            <td class="num ${isLoss ? 'loss' : ''}">${d.rieki}%</td>
            <td>
              <div class="bar-cell">
                <div class="bar-wrap" style="width:80px">
                  <div class="bar-fill ${isLowTanka ? 'negative' : 'positive'}" style="width:${pct}px"></div>
                </div>
                <span class="${isLowTanka ? 'low-tanka' : ''}">${fmt(d.jikanTanka)}</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
  }

  document.getElementById('content').innerHTML = html;

  // サマリー更新（工数がある顧客のみ）
  const sf = getFiltered();
  const sfWithKoshu = sf.filter(d => d.工数 > 0);
  const sk = sfWithKoshu.reduce((s,d) => s+d.工数, 0);
  const sh = sfWithKoshu.reduce((s,d) => s+d.報酬合計, 0);
  const ss = sfWithKoshu.reduce((s,d) => s+d.損益, 0);
  const st = sk > 0 ? Math.round(sh/sk) : 0;
  document.getElementById('sum-koshu').textContent = sk.toFixed(2);
  document.getElementById('sum-tanka').textContent = st.toLocaleString();
  const sel = document.getElementById('sum-soneki');
  sel.textContent = Math.round(ss).toLocaleString();
  sel.style.color = ss < 0 ? '#d93025' : '#333';
  document.getElementById('summary-cards').style.display = 'block';
}

function renderPagination(current, total, count) {
  return `<div class="pagination">
    <span>${count}件</span>
    <button class="page-btn" onclick="goPage(1)" ${current===1?'disabled':''}>«</button>
    <button class="page-btn" onclick="goPage(${current-1})" ${current===1?'disabled':''}>‹</button>
    <span>${current} / ${total}</span>
    <button class="page-btn" onclick="goPage(${current+1})" ${current===total?'disabled':''}>›</button>
    <button class="page-btn" onclick="goPage(${total})" ${current===total?'disabled':''}>»</button>
  </div>`;
}

function goPage(p) {
  currentPage = p;
  renderTable();
  document.querySelector('.main').scrollTop = 0;
}

function showDetail(id) {
  const filtered = getFiltered();
  const d = filtered.find(x => x.id === id);
  if (!d) return;

  document.getElementById('modal-title').textContent = d.name;
  document.getElementById('modal-subtitle').textContent = `報酬合計: ${fmt(d.報酬合計)}円 ／ 工数合計: ${d.工数.toFixed(2)}h ／ 時間単価: ${fmt(d.時間単価)}円/h`;

  const gyomuList = Object.entries(d.byGyomu).sort((a,b) => b[1]-a[1]);
  const totalKoshu = gyomuList.reduce((s,[,v]) => s+v, 0);

  let html = '';
  if (gyomuList.length > 0) {
    html += `<div class="modal-section">
      <div class="modal-section-title">業務別工数</div>
      <table class="detail-table">
        <thead><tr>
          <th>業務種別</th>
          <th>工数(h)</th>
          <th>構成比</th>
          <th>人件費</th>
        </tr></thead>
        <tbody>
          ${gyomuList.map(([g, h]) => `<tr>
            <td>${g}</td>
            <td>${h.toFixed(2)}</td>
            <td>${totalKoshu > 0 ? Math.round(h/totalKoshu*100) : 0}%</td>
            <td>${fmt(h * JIKEN_TANKA)}</td>
          </tr>`).join('')}
          <tr>
            <td>合計</td>
            <td>${totalKoshu.toFixed(2)}</td>
            <td>100%</td>
            <td>${fmt(totalKoshu * JIKEN_TANKA)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  } else {
    html += '<div class="modal-section"><p style="color:#666;font-size:12px">この期間の工数データがありません</p></div>';
  }

  // 担当者別工数テーブル
  const tantouList = Object.entries(d.byTantou || {}).sort((a,b) => b[1]-a[1]);
  if (tantouList.length > 0) {
    html += `<div class="modal-section">
      <div class="modal-section-title">担当者別工数</div>
      <table class="detail-table">
        <thead><tr><th>担当者</th><th>工数(h)</th><th>構成比</th></tr></thead>
        <tbody>
          ${tantouList.map(([t, h]) => `<tr>
            <td>${t}</td>
            <td>${h.toFixed(2)}</td>
            <td>${d.工数 > 0 ? Math.round(h/d.工数*100) : 0}%</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  html += `<div class="modal-section">
    <div class="modal-section-title">採算サマリー</div>
    <table class="detail-table">
      <tbody>
        <tr><td>年間報酬合計</td><td>${fmt(d.報酬合計)}円</td></tr>
        <tr><td>人件費合計</td><td>${fmt(d.人件費)}円</td></tr>
        <tr><td>損益</td><td style="color:${d.損益<0?'#d93025':'#333'}">${fmt(d.損益)}円</td></tr>
        <tr><td>利益率</td><td>${d.利益率}%</td></tr>
        <tr><td>時間単価</td><td>${fmt(d.時間単価)}円/h</td></tr>
      </tbody>
    </table>
  </div>`;

  // 前期比較
  if (d.前期報酬合計 > 0) {
    const diff = d.報酬合計 - d.前期報酬合計;
    const diffPct = Math.round(diff / d.前期報酬合計 * 100);
    const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
    html += `<div class="modal-section">
      <div class="modal-section-title">前期比較 ${d.旧月額期間 ? '（' + d.旧月額期間 + '）' : ''}</div>
      <table class="detail-table">
        <tbody>
          <tr><td>前期報酬合計</td><td>${fmt(d.前期報酬合計)}円</td></tr>
          <tr><td>今期報酬合計</td><td>${fmt(d.報酬合計)}円</td></tr>
          <tr><td>増減</td><td style="color:${diffColor};font-weight:600">${diff >= 0 ? '+' : ''}${fmt(diff)}円（${diffPct >= 0 ? '+' : ''}${diffPct}%）</td></tr>
        </tbody>
      </table>
    </div>`;
  }

  // 適正価格シミュレーション
  html += `<div class="modal-section">
    <div class="modal-section-title">適正価格シミュレーション</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font-size:12px;color:var(--text-muted)">目標時間単価</span>
      <input type="number" id="sim-tanka-${d.id}" value="10000" style="width:100px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-family:inherit;font-size:12px" oninput="updateSim('${d.id}', ${d.工数}, ${d.報酬合計})">
      <span style="font-size:12px;color:var(--text-muted)">円/h</span>
    </div>
    <table class="detail-table" id="sim-table-${d.id}">
      <tbody>
        <tr><td>現在の工数</td><td>${d.工数.toFixed(2)}h</td></tr>
        <tr><td>適正報酬（目標単価×工数）</td><td id="sim-tekisei-${d.id}">${fmt(10000 * d.工数)}円</td></tr>
        <tr><td>現在の報酬</td><td>${fmt(d.報酬合計)}円</td></tr>
        <tr><td>乖離</td><td id="sim-diff-${d.id}" style="font-weight:600">${fmt(d.報酬合計 - 10000 * d.工数)}円</td></tr>
        <tr><td>現在報酬での許容工数</td><td id="sim-허용-${d.id}">${d.工数 > 0 ? Math.round(d.報酬合計 / 10000 * 10) / 10 : '—'}h</td></tr>
      </tbody>
    </table>
  </div>`;

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function showMemberDetail(name, byGyomu) {
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-subtitle').textContent = 'メンバー別業務工数内訳';

  const gyomuList = Object.entries(byGyomu).sort((a,b) => b[1]-a[1]);
  const totalH = gyomuList.reduce((s,[,v]) => s+v, 0);

  let html = `<div class="modal-section">
    <div class="modal-section-title">業務別工数</div>
    <table class="detail-table">
      <thead><tr><th>業務種別</th><th>工数(h)</th><th>構成比</th></tr></thead>
      <tbody>
        ${gyomuList.map(([g,h]) => `<tr>
          <td>${g}</td>
          <td>${h.toFixed(2)}</td>
          <td>${totalH > 0 ? Math.round(h/totalH*100) : 0}%</td>
        </tr>`).join('')}
        <tr><td>合計</td><td>${totalH.toFixed(2)}</td><td>100%</td></tr>
      </tbody>
    </table>
  </div>`;

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function updateSim(id, koshu, hoshu) {
  const tanka = parseInt(document.getElementById('sim-tanka-' + id).value) || 0;
  const tekisei = Math.round(tanka * koshu);
  const diff = hoshu - tekisei;
  const yoryo = tanka > 0 ? Math.round(hoshu / tanka * 10) / 10 : 0;
  const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('sim-tekisei-' + id).textContent = fmt(tekisei) + '円';
  const diffEl = document.getElementById('sim-diff-' + id);
  diffEl.textContent = (diff >= 0 ? '+' : '') + fmt(diff) + '円';
  diffEl.style.color = diffColor;
  document.getElementById('sim-허용-' + id).textContent = yoryo + 'h';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
}

onPeriodChange();

</script>
</body>
</html>
